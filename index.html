<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; padding: 24px; font-size: 20px; }
    button { font-size: 20px; padding: 12px 16px; }
    .v { font-size: 28px; margin: 12px 0; }
  </style>
</head>
<body>
  <button id="start">Start gyro</button>
  <div class="v">alpha z: <span id="a">-</span> deg/s</div>
  <div class="v">beta x: <span id="b">-</span> deg/s</div>
  <div class="v">gamma y: <span id="g">-</span> deg/s</div>

  <script>
    const a = document.getElementById("a");
    const b = document.getElementById("b");
    const g = document.getElementById("g");

    async function start() {
      if (typeof DeviceMotionEvent !== "undefined" &&
          typeof DeviceMotionEvent.requestPermission === "function") {
        const permission = await DeviceMotionEvent.requestPermission();
        if (permission !== "granted") {
          alert("Permission denied");
          return;
        }
      }

      window.addEventListener("devicemotion", (event) => {
        const r = event.rotationRate;
        if (!r) return;

        a.textContent = r.alpha?.toFixed(2) ?? "-";
        b.textContent = r.beta?.toFixed(2) ?? "-";
        g.textContent = r.gamma?.toFixed(2) ?? "-";
      });
    }

    document.getElementById("start").addEventListener("click", start);
  </script>
</body>
</html>
