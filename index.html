<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: sans-serif;
      padding: 24px;
      font-size: 20px;
      line-height: 1.5;
    }

    button, select {
      font-size: 20px;
      padding: 12px 16px;
      margin: 0 8px 16px 0;
    }

    .main-value {
      font-size: 48px;
      font-weight: bold;
      margin: 20px 0;
    }

    .sub-value {
      font-size: 18px;
      color: #555;
      margin: 6px 0;
    }

    .small {
      font-size: 16px;
      color: #555;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <button id="start">Start gyro</button>
  <button id="stop" disabled>Stop gyro</button>

  <div>
    Display update:
    <select id="displayRate">
      <option value="1" selected>Every sample</option>
      <option value="2">1 / 2 samples</option>
      <option value="4">1 / 4 samples</option>
      <option value="6">1 / 6 samples</option>
      <option value="8">1 / 8 samples</option>
      <option value="10">1 / 10 samples</option>
    </select>
  </div>

  <div class="main-value">
    gamma y: <span id="g">-</span> deg/s
  </div>

  <div class="sub-value">
    alpha z: <span id="a">-</span> deg/s
  </div>

  <div class="sub-value">
    beta x: <span id="b">-</span> deg/s
  </div>

  <div class="small">
    <div>表示だけを間引いています。フィルタ処理はしていません。</div>
    <div>1/2なら、センサーイベント2回に1回だけ画面表示を更新します。</div>
  </div>

  <script>
    const a = document.getElementById("a");
    const b = document.getElementById("b");
    const g = document.getElementById("g");

    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    const displayRateSelect = document.getElementById("displayRate");

    let isRunning = false;
    let sampleCount = 0;
    let displayEvery = Number(displayRateSelect.value);

    displayRateSelect.addEventListener("change", () => {
      displayEvery = Number(displayRateSelect.value);
      sampleCount = 0;
    });

    function handleMotion(event) {
      const r = event.rotationRate;
      if (!r) return;

      sampleCount += 1;

      if (sampleCount % displayEvery !== 0) {
        return;
      }

      g.textContent = r.gamma?.toFixed(2) ?? "-";
      a.textContent = r.alpha?.toFixed(2) ?? "-";
      b.textContent = r.beta?.toFixed(2) ?? "-";
    }

    async function start() {
      if (isRunning) return;

      if (typeof DeviceMotionEvent !== "undefined" &&
          typeof DeviceMotionEvent.requestPermission === "function") {
        const permission = await DeviceMotionEvent.requestPermission();
        if (permission !== "granted") {
          alert("Permission denied");
          return;
        }
      }

      sampleCount = 0;

      window.addEventListener("devicemotion", handleMotion);

      isRunning = true;
      startButton.disabled = true;
      stopButton.disabled = false;
    }

    function stop() {
      if (!isRunning) return;

      window.removeEventListener("devicemotion", handleMotion);

      isRunning = false;
      startButton.disabled = false;
      stopButton.disabled = true;
    }

    startButton.addEventListener("click", start);
    stopButton.addEventListener("click", stop);
  </script>
</body>
</html>
